<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#22c55e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="משחק הזכרון">
<title>משחק הזכרון</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">🧠 משחק הזכרון</div>
    <div class="moves-pill">מהלכים: <span id="movesVal">0</span></div>
  </header>

  <!-- Home screen -->
  <section id="screen-home" class="screen active">
    <div class="hero-card">
      <h1>משחק הזכרון</h1>
      <p>מצאו את הזוגות הזהים! המשחק כולל 4 שלבי התקדמות, מהקטן לגדול.</p>
      <div class="stage-list" id="stageList"></div>
      <button id="startBtn" class="btn btn-primary btn-big">התחילו במשחק 🎮</button>
    </div>
  </section>

  <!-- Game screen -->
  <section id="screen-game" class="screen">
    <div class="game-topline">
      <button id="exitGameBtn" class="icon-btn" aria-label="יציאה">✕</button>
      <div class="stage-label" id="stageLabel"></div>
      <div class="pairs-label"><span id="pairsFoundVal">0</span>/<span id="pairsTotalVal">0</span> זוגות</div>
    </div>

    <div class="board" id="board"></div>
  </section>

  <!-- Result overlay -->
  <div id="resultOverlay" class="overlay">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">כל הכבוד!</h2>
      <p id="resultText"></p>
      <div class="result-actions">
        <button id="nextStageBtn" class="btn btn-primary btn-big">לשלב הבא</button>
        <button id="backHomeBtn" class="btn btn-ghost">חזרה לתפריט</button>
      </div>
    </div>
  </div>

</div>

<script src="js/memory-data.js"></script>
<script src="js/memory-game.js"></script>
</body>
</html>
